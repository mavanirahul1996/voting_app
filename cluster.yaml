
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: voting-app-eks
  region: us-east-1

iam:
  withOIDC: true

addons:
  - name: aws-ebs-csi-driver
    attachPolicyARNs:
      - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy

managedNodeGroups:
  - name: voting-workers
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
